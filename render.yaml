services:
  - type: web
    name: tsidek-os
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: SUPABASE_JWKS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TSIDEK_GEMINI_MODEL
        value: "gemini-2.5-flash"
      - key: OPENROUTER_API_KEY
        sync: false
      - key: TSIDEK_OPENROUTER_MODEL
        value: "meta-llama/llama-3.3-70b-instruct"
      - key: TSIDEK_LOCAL_AI_BASE_URL
        sync: false
      - key: TSIDEK_LOCAL_AI_MODEL
        value: "gemma3"
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_STARTTLS
        value: "true"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_GRAPH_VERSION
        value: "v20.0"
      - key: PAWAPAY_API_URL
        value: "https://api.pawapay.io/v1"
      - key: PAWAPAY_API_KEY
        sync: false
      - key: PAWAPAY_CALLBACK_URL
        sync: false
      - key: PAWAPAY_PAYMENT_REQUEST_PATH
        sync: false
      - key: ONEDRIVE_TENANT_ID
        sync: false
      - key: ONEDRIVE_CLIENT_ID
        sync: false
      - key: ONEDRIVE_CLIENT_SECRET
        sync: false
      - key: ONEDRIVE_DRIVE_ID
        sync: false
      - key: ONEDRIVE_RAG_FOLDER_PATH
        value: "TSIDEK RAG Sources"
      - key: NEXTCLOUD_BASE_URL
        sync: false
      - key: TSIDEK_CRON_SECRET
        sync: false
