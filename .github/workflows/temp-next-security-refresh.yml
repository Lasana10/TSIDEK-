name: Temporary Next Security Lock Refresh

on:
  push:
    branches: [fix/expose-live-upgrade]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/expose-live-upgrade
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install next@16.3.8 --save-exact
      - run: npm audit --omit=dev --audit-level=critical
      - name: Commit refreshed lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -m "Upgrade Next.js security patch"
          git push origin HEAD:fix/expose-live-upgrade
