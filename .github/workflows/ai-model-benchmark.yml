name: Controlled AI Model Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout benchmark script commit
        uses: actions/checkout@v4
        with:
          ref: 2dd466aa289b398fa50d0edfd4d76bf8424095ba

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          BENCHMARK_MODELS: z-ai/glm-5.3-flash,anthropic/claude-haiku-5.5,deepseek/deepseek-v4.1-flash
          BENCHMARK_OUTPUT: ai-benchmark-v2.json
        run: node scripts/ai-benchmark-v2.mjs

      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-benchmark-v2-report
          path: ai-benchmark-v2.json
          if-no-files-found: ignore
