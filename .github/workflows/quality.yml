name: TSIDEK Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Session authorization regression tests
        run: npm run test:auth-contract

      - name: Firm role and revoked membership boundary tests
        run: node --experimental-strip-types --test scripts/firm-role-boundary.test.mjs

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=critical
